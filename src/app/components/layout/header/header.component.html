
<header class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <!-- Logo and App Name -->
      <div class="flex items-center">
        <a routerLink="/" class="flex-shrink-0 flex items-center">
          <img class="h-8 w-auto" src="assets/logo.svg" alt="BeaconTrack Logo" />
          <span class="ml-2 text-xl font-semibold text-primary-dark">BeaconTrack</span>
        </a>
      </div>

      <!-- Right side nav items -->
      <div class="flex items-center">
        <!-- Notification button -->
        <button 
          (click)="toggleNotificationsPanel()" 
          class="ml-4 p-2 rounded-full text-gray-600 hover:bg-gray-100 relative"
          aria-label="Notifications"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span *ngIf="unreadNotifications > 0" class="absolute top-1 right-1 bg-secondary text-white text-xs w-4 h-4 flex items-center justify-center rounded-full">
            {{ unreadNotifications > 9 ? '9+' : unreadNotifications }}
          </span>
        </button>

        <!-- Profile dropdown -->
        <div class="ml-4 relative flex-shrink-0">
          <div>
            <button 
              (click)="toggleProfileMenu()" 
              class="flex items-center text-sm rounded-full focus:outline-none"
              aria-label="User menu"
            >
              <img class="h-8 w-8 rounded-full object-cover" [src]="user?.profileImage || 'assets/default-avatar.png'" alt="User Avatar" />
              <span class="ml-2 text-gray-700 hidden md:block">{{ user?.name || 'User' }}</span>
              <svg class="ml-1 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
          </div>
          
          <!-- Profile dropdown menu -->
          <div *ngIf="showProfileMenu" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
            <div class="py-1" role="menu" aria-orientation="vertical" aria-labelledby="user-menu">
              <a (click)="viewProfile()" class="flex px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Your Profile
              </a>
              <a routerLink="/subscription" (click)="closeMenus()" class="flex px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Subscription
              </a>
              <a routerLink="/settings" (click)="closeMenus()" class="flex px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Settings
              </a>
              <div class="border-t border-gray-100"></div>
              <a (click)="logout()" class="flex px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer" role="menuitem">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sign out
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Notifications panel -->
  <div *ngIf="showNotificationsPanel" class="origin-top-right absolute right-4 mt-2 w-80 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
    <div class="py-2 px-4 border-b border-gray-100 flex justify-between items-center">
      <h3 class="text-sm font-semibold text-gray-700">Notifications</h3>
      <a routerLink="/notifications" (click)="closeMenus()" class="text-xs text-primary hover:text-primary-dark">View All</a>
    </div>
    <div class="max-h-80 overflow-y-auto">
      <app-notification-item></app-notification-item>
    </div>
  </div>
</header>
