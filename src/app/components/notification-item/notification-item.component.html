
<div *ngIf="notifications.length === 0" class="py-4 text-center text-gray-500 text-sm">
  No notifications
</div>

<div *ngFor="let notification of notifications" 
     class="border-b border-gray-100 last:border-b-0"
     [ngClass]="{'bg-gray-50': !notification.read}">
  <div class="px-4 py-3">
    <div class="flex items-start">
      <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center" 
           [ngStyle]="{'background-color': notification.color + '33'}">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" [ngStyle]="{'color': notification.color}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      </div>
      <div class="ml-3 flex-1">
        <div class="flex items-start justify-between">
          <p class="text-sm font-medium text-gray-900">{{ notification.title }}</p>
          <div class="flex-shrink-0 flex">
            <button *ngIf="!notification.read" 
                    (click)="markAsRead(notification.id, $event)" 
                    class="ml-2 text-gray-400 hover:text-primary"
                    title="Mark as read">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
            </button>
            <button (click)="deleteNotification(notification.id, $event)" 
                    class="ml-2 text-gray-400 hover:text-red-500"
                    title="Delete notification">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <p class="text-xs text-gray-500 mt-1">{{ notification.message }}</p>
        <p class="text-xs text-gray-400 mt-1">{{ getTimeAgo(notification.timestamp) }}</p>
      </div>
    </div>
  </div>
</div>
